name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (pytest + lint)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: banking
          POSTGRES_PASSWORD: banking_test_password
          POSTGRES_DB: banking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U banking -d banking_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (ruff, if configured)
        run: ruff check . || echo "ruff not configured — skipping"
      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg2://banking:banking_test_password@localhost:5432/banking_test
          JWT_SECRET: ci-test-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          REFRESH_TOKEN_EXPIRE_DAYS: "7"
          CORS_ORIGINS: http://localhost:5173
          ENVIRONMENT: test
        run: pytest -q

  frontend:
    name: frontend (typecheck + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck --if-present || npx tsc --noEmit
      - name: Lint
        run: npm run lint --if-present
      - name: Build
        env:
          VITE_API_URL: http://localhost:8000
        run: npm run build

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Fallback grep scan (if gitleaks skipped)
        if: always()
        run: |
          echo "Scanning for accidental secrets (.env files, private keys, hardcoded tokens)..."
          ! git ls-files | grep -E '(^|/)\.env$' || (echo "::error::Committed .env file detected" && exit 1)
          ! grep -rInE --exclude-dir=node_modules --exclude-dir=.venv --exclude-dir=.git \
            -e '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' \
            -e 'AKIA[0-9A-Z]{16}' \
            -e 'xox[baprs]-[0-9A-Za-z-]{10,}' . || (echo "::error::Possible secret matched" && exit 1)
          echo "Secret scan passed."
